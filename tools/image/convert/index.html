<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../app.css" />
    <title>Convert & Compress Images — TooldeckAI</title>
    <link
      rel="canonical"
      href="https://kumailsadd.github.io/tooldeckai/tools/image/convert/"
    />
    <link rel="manifest" href="../../../manifest.webmanifest" />
    <meta name="theme-color" content="#0ea5e9" />
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      .btn {
        padding: 8px 12px;
        border-radius: 8px;
      }
      .btn-blue {
        background: #0ea5e9;
        color: #fff;
      }
      .btn-gray {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="max-w-4xl mx-auto p-6 space-y-6">
      <a href="../../../" class="text-sky-600 hover:underline">&larr; Home</a>
      <div
        class="adsense-box rounded border bg-white p-3 text-center text-slate-500"
      >
        Ad slot
      </div>
      <h1 class="text-2xl font-extrabold">Convert & Compress Images</h1>

      <div class="rounded-lg border bg-white p-4">
        <label class="block text-sm font-medium mb-2"
          >Choose images (max 25 MB each)</label
        >
        <input
          id="picker"
          class="block w-full"
          type="file"
          accept="image/*"
          multiple
        />
        <div class="mt-3 text-xs text-slate-600">
          <span id="count">0</span> selected
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-600">Target format</label>
          <select id="fmt" class="w-full border rounded px-2 py-1">
            <option value="image/webp">WEBP (recommended)</option>
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
            <option value="image/avif">AVIF (if supported)</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-600">Quality</label>
          <input
            id="q"
            class="w-full"
            type="range"
            min="0.1"
            max="1"
            step="0.05"
            value="0.9"
          />
          <div class="text-xs text-slate-600 mt-1" id="qp">90%</div>
        </div>
      </div>

      <div id="err" class="text-sm text-red-600 hidden"></div>
      <div id="info" class="text-sm text-sky-700 hidden"></div>

      <button class="btn btn-blue" id="go" disabled>Convert & Download</button>

      <p class="text-xs text-slate-500">
        All processing happens in your browser. Nothing is uploaded.
      </p>
    </main>

    <script>
      const picker = document.getElementById("picker"),
        count = document.getElementById("count");
      const fmt = document.getElementById("fmt"),
        q = document.getElementById("q"),
        qp = document.getElementById("qp");
      const go = document.getElementById("go"),
        err = document.getElementById("err"),
        info = document.getElementById("info");
      const JSZip = window.JSZip;

      let files = [];

      function setErr(m) {
        err.textContent = m;
        err.classList.remove("hidden");
      }
      function clrErr() {
        err.classList.add("hidden");
        err.textContent = "";
      }
      function setInfo(m) {
        info.textContent = m;
        info.classList.remove("hidden");
      }
      function clrInfo() {
        info.classList.add("hidden");
        info.textContent = "";
      }

      picker.addEventListener("change", (e) => {
        clrErr();
        clrInfo();
        files = Array.from(e.target.files || []).filter((f) =>
          f.type.startsWith("image/")
        );
        if (files.some((f) => f.size > 25 * 1024 * 1024)) {
          setErr("One or more images exceed 25 MB.");
          files = [];
        }
        count.textContent = files.length;
        go.disabled = files.length === 0;
      });
      q.addEventListener(
        "input",
        () => (qp.textContent = Math.round(Number(q.value) * 100) + "%")
      );

      function sanitizeBase(n) {
        return (n.replace(/\.[^/.]+$/, "") || "image")
          .normalize("NFKD")
          .replace(/[^\w\-]+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-+|-+$/g, "");
      }
      function loadImage(f) {
        return new Promise((res, rej) => {
          const u = URL.createObjectURL(f);
          const i = new Image();
          i.onload = () => {
            URL.revokeObjectURL(u);
            res(i);
          };
          i.onerror = (e) => {
            URL.revokeObjectURL(u);
            rej(e);
          };
          i.src = u;
        });
      }
      function toBlob(c, t, qq) {
        return new Promise((res, rej) =>
          c.toBlob((b) => (b ? res(b) : rej(new Error("Encode failed"))), t, qq)
        );
      }
      function dl(b, n) {
        const u = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = u;
        a.download = n;
        a.click();
        URL.revokeObjectURL(u);
      }

      go.addEventListener("click", async () => {
        clrErr();
        clrInfo();
        if (files.length === 0) {
          setErr("Choose at least one image.");
          return;
        }
        try {
          const multiple = files.length > 1;
          const zip = multiple ? new JSZip() : null;
          for (let i = 0; i < files.length; i++) {
            setInfo(`Processing ${i + 1} of ${files.length}…`);
            const img = await loadImage(files[i]);
            const c = document.createElement("canvas");
            c.width = img.naturalWidth;
            c.height = img.naturalHeight;
            const ctx = c.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, 0, 0);
            let type = fmt.value;
            let blob;
            try {
              blob = await toBlob(
                c,
                type,
                type === "image/png" ? 0.92 : Number(q.value)
              );
            } catch {
              type = "image/webp";
              blob = await toBlob(c, type, Number(q.value));
            }
            const ext =
              type === "image/png"
                ? "png"
                : type === "image/jpeg"
                ? "jpg"
                : type === "image/avif"
                ? "avif"
                : "webp";
            const name = `${sanitizeBase(files[i].name)}.${ext}`;
            if (multiple) {
              const arr = new Uint8Array(await blob.arrayBuffer());
              zip.file(name, arr);
            } else {
              dl(blob, name);
            }
            await new Promise((r) => setTimeout(r, 0));
          }
          if (zip) {
            const out = await zip.generateAsync({ type: "blob" });
            dl(out, "converted-images.zip");
          }
          setInfo("Download started.");
        } catch (e) {
          console.error(e);
          setErr("Failed to convert images.");
        }
      });
    </script>
    <script defer src="../../../consent.js"></script>
    <script defer src="../../../ads.js"></script>
  </body>
</html>
