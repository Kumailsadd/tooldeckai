<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../app.css" />
    <title>Compress PDF — TooldeckAI</title>
    <link
      rel="canonical"
      href="https://kumailsadd.github.io/tooldeckai/tools/pdf/compress/"
    />
    <link rel="manifest" href="../../../manifest.webmanifest" />
    <meta name="theme-color" content="#0ea5e9" />
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.js";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
      .btn {
        padding: 8px 12px;
        border-radius: 8px;
      }
      .btn-blue {
        background: #0ea5e9;
        color: #fff;
      }
      .btn-gray {
        background: #e2e8f0;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="max-w-4xl mx-auto p-6 space-y-6">
      <a href="../../../" class="text-sky-600 hover:underline">&larr; Home</a>
      <div
        class="adsense-box rounded border bg-white p-3 text-center text-slate-500"
      >
        Ad slot
      </div>
      <h1 class="text-2xl font-extrabold">Compress PDF</h1>

      <div class="rounded-lg border bg-white p-4">
        <label class="block text-sm font-medium mb-2"
          >Choose PDF (max 25 MB)</label
        >
        <input
          id="picker"
          class="block w-full"
          type="file"
          accept="application/pdf"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-600">Quality</label>
          <input
            id="q"
            class="w-full"
            type="range"
            min="0.1"
            max="1"
            step="0.05"
            value="0.7"
          />
          <div class="text-xs text-slate-600 mt-1" id="qp">70%</div>
        </div>
        <div>
          <label class="text-xs text-slate-600">Resolution (scale %)</label>
          <input
            id="s"
            class="w-full"
            type="range"
            min="50"
            max="120"
            step="5"
            value="80"
          />
          <div class="text-xs text-slate-600 mt-1" id="sp">80%</div>
        </div>
      </div>

      <div id="err" class="text-sm text-red-600 hidden"></div>
      <div id="info" class="text-sm text-sky-700 hidden"></div>

      <button id="go" class="btn btn-blue" disabled>Compress & Download</button>
      <p class="text-xs text-slate-500">
        This method rasterizes each page and re-encodes as JPEG. Great for PDFs
        with images.
      </p>
    </main>

    <script>
      const picker = document.getElementById("picker");
      const q = document.getElementById("q"),
        qp = document.getElementById("qp");
      const s = document.getElementById("s"),
        sp = document.getElementById("sp");
      const go = document.getElementById("go");
      const err = document.getElementById("err"),
        info = document.getElementById("info");
      const { PDFDocument } = window.PDFLib;

      let file = null;
      function setErr(m) {
        err.textContent = m;
        err.classList.remove("hidden");
      }
      function clrErr() {
        err.classList.add("hidden");
        err.textContent = "";
      }
      function setInfo(m) {
        info.textContent = m;
        info.classList.remove("hidden");
      }
      function clrInfo() {
        info.classList.add("hidden");
        info.textContent = "";
      }

      picker.addEventListener("change", (e) => {
        file = e.target.files?.[0] || null;
        go.disabled = !file;
        clrErr();
        clrInfo();
      });
      q.addEventListener(
        "input",
        () => (qp.textContent = Math.round(Number(q.value) * 100) + "%")
      );
      s.addEventListener("input", () => (sp.textContent = s.value + "%"));

      function dl(b, n) {
        const u = URL.createObjectURL(b);
        const a = document.createElement("a");
        a.href = u;
        a.download = n;
        a.click();
        URL.revokeObjectURL(u);
      }
      function sanitizeBase(n) {
        return (n.replace(/\.[^/.]+$/, "") || "document")
          .normalize("NFKD")
          .replace(/[^\w\-]+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      go.addEventListener("click", async () => {
        clrErr();
        clrInfo();
        if (!file) {
          setErr("Select a PDF first.");
          return;
        }
        if (file.size > 25 * 1024 * 1024) {
          setErr("File exceeds 25 MB.");
          return;
        }
        try {
          const data = await file.arrayBuffer();
          const src = await pdfjsLib.getDocument({ data }).promise;
          const out = await PDFDocument.create();
          const total = src.numPages;
          const scale = Math.max(0.5, Math.min(1.2, Number(s.value) / 100));

          for (let i = 1; i <= total; i++) {
            setInfo(`Processing page ${i} of ${total}…`);
            const page = await src.getPage(i);
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.floor(viewport.width));
            canvas.height = Math.max(1, Math.floor(viewport.height));
            const ctx = canvas.getContext("2d");
            await page.render({ canvasContext: ctx, viewport }).promise;
            const blob = await new Promise((res, rej) =>
              canvas.toBlob(
                (b) => (b ? res(b) : rej(new Error("Encode failed"))),
                "image/jpeg",
                Number(q.value)
              )
            );
            const imgBytes = new Uint8Array(await blob.arrayBuffer());
            const jpg = await out.embedJpg(imgBytes);
            const p = out.addPage([canvas.width, canvas.height]);
            p.drawImage(jpg, {
              x: 0,
              y: 0,
              width: canvas.width,
              height: canvas.height,
            });
            canvas.width = 0;
            canvas.height = 0;
          }
          const outBytes = await out.save();
          dl(
            new Blob([outBytes], { type: "application/pdf" }),
            `${sanitizeBase(file.name)}_compressed.pdf`
          );
          setInfo("Download started.");
        } catch (e) {
          console.error(e);
          setErr("Failed to compress PDF.");
        }
      });
    </script>
    <script defer src="../../../consent.js"></script>
    <script defer src="../../../ads.js"></script>
  </body>
</html>
